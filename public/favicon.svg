<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="civicFavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="towerGlassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#civicFavGrad)" />
  <rect x="2.5" y="2.5" width="43" height="43" rx="12.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
  
  <!-- Subtle Glass Sheen -->
  <path d="M4 14C4 7.925 8.925 3 15 3H33C39.075 3 44 7.925 44 14V17C44 17 33 22 24 22C15 22 4 17 4 17V14Z" fill="#FFFFFF" fill-opacity="0.12" />

  <!-- Base Line -->
  <line x1="9" y1="37" x2="39" y2="37" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" />

  <!-- Left Tower -->
  <rect x="11.5" y="23" width="6.5" height="14" rx="1.5" fill="url(#towerGlassGrad)" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.2" />
  
  <!-- Right Tower -->
  <rect x="30" y="20" width="6.5" height="17" rx="1.5" fill="url(#towerGlassGrad)" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.2" />

  <!-- Center Skyscraper -->
  <rect x="20" y="16.5" width="8" height="20.5" rx="1.5" fill="url(#towerGlassGrad)" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="1.3" />
  <line x1="24" y1="19" x2="24" y2="34" stroke="#67E8F9" stroke-opacity="0.9" stroke-width="1.2" stroke-dasharray="2 1.5" />

  <!-- Connecting AI Neural Network -->
  <path d="M14.75 23 L24 16.5 L33.25 20" stroke="#A5F3FC" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <line x1="24" y1="16.5" x2="24" y2="10.5" stroke="#E0F2FE" stroke-width="1.4" stroke-dasharray="1.5 1" />

  <!-- Nodes -->
  <circle cx="14.75" cy="23" r="1.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="33.25" cy="20" r="1.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="24" cy="16.5" r="1.6" fill="#67E8F9" stroke="#FFFFFF" stroke-width="0.8" />

  <!-- Apex Beacon -->
  <circle cx="24" cy="9.5" r="2.8" fill="#FFFFFF" />
  <circle cx="24" cy="9.5" r="1.6" fill="#38BDF8" />

  <!-- Pulse Wave Arcs -->
  <path d="M19 8C20.3 6.8 22.1 6 24 6C25.9 6 27.7 6.8 29 8" stroke="url(#pulseGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />
  <path d="M16 5.2C18.2 3.8 21 3 24 3C27 3 29.8 3.8 32 5.2" stroke="url(#pulseGrad)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.75" fill="none" />
</svg>